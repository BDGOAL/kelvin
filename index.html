 ],sources:[['高山—白川鄉 巴士','https://www.nouhibus.co.jp/route_bus/shirakawago/'],['高山—松本冬季巴士','https://www.nouhibus.co.jp/highwaybus/matsumoto/'],['東京—高山高速巴士','https://www.highwaybus.com/'],['ひらゆの森','https://www.hirayunomori.co.jp/'],['溪流莊 Shiorie 冬季資訊','https://www.siorie.com/zh-tw/winter'],['Little Peaks 12/25 相關公告','https://www.littlepeaks.jp/news/news_detail.html?id=20251028121809&part=part1'],['JR East / Narita Express','https://www.jreast.co.jp/multi/en/nex/'],['ALPICO 車山高原巴士','https://www.alpico.co.jp/traffic/local/suwa/shirakabako/']]};
const $=s=>document.querySelector(s),fmtJPY=n=>n==null?'待報價':'¥'+Number(n).toLocaleString('ja-JP'),fmtHK=n=>n==null?'—':'HK$'+Math.round(n*getRate()).toLocaleString('en-HK'),esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');const getRate=()=>{let n=Number(localStorage.getItem('tripFX2026'));return n>0&&n<1?n:DATA.rate};
const nav=[['overview','總覽'],...DATA.days.map((d,i)=>['day'+i,'Day '+(i+1)+' · '+d.date]),['hotels','住宿＋Meals'],['budget','預算'],['tasks','待辦＋連結']];
function navRender(){ $('#tabs').innerHTML=nav.map(([k,t],i)=>`<button class="tab ${i===0?'active':''}" data-tab="${k}">${esc(t)}</button>`).join(''); document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>show(x.dataset.tab)); }
function show(key){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===key));document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===key));window.location.hash=key;window.scrollTo({top:0,behavior:'instant'});}
function statePill(t){return `<span class="pill ${/已購|已付款|已包含/.test(t)?'booked':'pending'}">${esc(t)}</span>`}
function overview(){let sum=DATA.budget.reduce((a,b)=>a+(b[1]||0),0);return `<section class="screen active" id="overview"><div class="section-head"><div><h2>旅程一眼睇</h2><p>目前已買機票，其餘酒店、巴士及 Tour 仍需逐項落實。</p></div></div><div class="cards"><div class="card"><div class="k">去程航班</div><div class="v">GK028</div><div class="d">12/22 · 06:20 到成田 T3</div></div><div class="card"><div class="k">回程航班</div><div class="v">GK027</div><div class="d">12/27 · 19:30 成田 T3 起飛</div></div><div class="card"><div class="k">已知兩人預算（非全額）</div><div class="v">${fmtHK(sum)}</div><div class="d">${fmtJPY(sum)} · 缺酒店、部分JR及機票金額</div></div></div><div class="section-head"><h2>每日重點</h2></div><div class="boxrow"><div class="panel">${DATA.days.map((d,i)=>`<div class="route"><div class="day">DAY ${i+1}<br>${d.date}</div><div><div class="main">${d.title}</div><div class="small">${d.tag}</div></div><div class="hotel">${esc(d.hotel)}</div></div>`).join('')}</div><div class="aside-stack"><div class="panel"><h3>目前已知住宿</h3><div class="kv"><span>12/23 · ひらゆの森</span><span>${fmtHK(22500)}<br><span class="tiny">雙人一晚</span></span></div><div class="kv"><span>12/24–26 · Shiorie</span><span>${fmtHK(117040)}<br><span class="tiny">雙人兩晚</span></span></div><div class="kv"><span>Tour 12/25</span><span>有團／待訂</span></div></div><div class="notice">⚠️ 最關鍵嘅問題係 12/25 溪流莊早餐、午餐同 Little Peaks 08:45 集合是否能配合。上高地亦可能因風雪／雪崩風險取消。</div><div class="panel"><h3>快捷連結</h3><div class="links"><a href="https://docs.google.com/spreadsheets/d/18L3GqkYa9z_AUae4qXioH61BksbPwdilQVwCQWacoMo/edit" target="_blank">Google Sheets</a><a href="https://www.littlepeaks.jp/" target="_blank">Little Peaks</a><a href="https://www.siorie.com/zh-tw/winter" target="_blank">溪流莊</a><a href="https://www.nouhibus.co.jp/highwaybus/matsumoto/" target="_blank">冬季巴士</a></div></div></div></div></section>`}
function dayScreen(d,i){return `<section class="screen" id="day${i}"><div class="section-head day-header"><div><div class="eyebrow" style="color:#0c7771">DAY ${i+1} · 2026/${d.date}（${d.week}）</div><h2>${esc(d.title)}</h2><p>${esc(d.tag)} · ${esc(d.hotel)}</p></div>${statePill(i===3?'Tour有團 · 未訂位':'預訂狀態見每項')}</div><div class="day-grid"><div><div class="agenda">${d.events.map(e=>`<div class="event ${e[1]==='交通'||e[1]==='航班'||e[1]==='接送'?'transport':e[1]==='餐食'?'meal':''}"><div class="topline"><span class="time">${esc(e[0])}</span><span class="type">${esc(e[1])}</span></div><h3>${esc(e[2])}</h3><p>${esc(e[3])}</p><small>${esc(e[4])}</small></div>`).join('')}</div></div><div class="aside-stack"><div class="panel"><h3>🍽️ Meals 安排</h3>${d.meals.map(m=>`<div class="kv"><span style="line-height:1.55">${esc(m)}</span></div>`).join('')}</div><div class="panel"><h3>🏨 當晚住宿</h3><div class="infoname">${esc(d.hotel)}</div><div class="break"></div><div class="tiny">已確認機票以外，其餘房間與車票未必已成功預訂。請以實際訂單為準。</div></div>${i===4?`<div class="notice">車山備選：茅野冬季巴士 09:35／10:35 上山，但由沢渡09:17出發先到松本10:23，通常無法接10:35；故本行程建議諏訪湖。</div>`:''}</div></div></section>`}
function hotelScreen(){return `<section class="screen" id="hotels"><div class="section-head"><div><h2>住宿 Package ＋ Meals</h2><p>房價全部係雙人合計；「原價」同「採用會員價」分開列出。</p></div></div><div class="panel table-scroll" style="padding:0"><table><thead><tr><th>住宿日期</th><th>酒店／Package</th><th class="money">原價 (JPY)</th><th class="money">採用價 (JPY)</th><th class="money">約 HKD</th><th>膳食／狀態</th></tr></thead><tbody>${DATA.hotels.map(h=>`<tr><td>${esc(h.date)}</td><td><strong>${esc(h.name)}</strong><br><span class="muted">${esc(h.plan)}</span></td><td class="money">${fmtJPY(h.normal)}</td><td class="money"><strong>${fmtJPY(h.price)}</strong></td><td class="money">${fmtHK(h.price)}</td><td>${esc(h.meals)}<br><br>${statePill(h.status)}</td></tr>`).join('')}</tbody></table></div><div class="section-head"><h2>餐食安排重點</h2></div><div class="split"><div class="notice blue">ひらゆの森：12/23 包晚餐、12/24 07:30 開始供應早餐；退房 07:00–10:00。</div><div class="notice">Shiorie：12/24–26 兩晚三餐療癒方案，但餐食如何跨入住日分配、12/25 早餐可否早食、午餐可否外帶，仍然要酒店確認。</div></div><div class="section-head"><h2>溪流莊方案比較</h2></div><div class="cards"><div class="card"><div class="k">基本琉球榻榻米和室 · 18㎡</div><div class="v">¥104,500</div><div class="d">會員價兩人兩晚 · ${fmtHK(104500)}</div></div><div class="card"><div class="k">足湯露台套房 · 43㎡</div><div class="v">¥117,040</div><div class="d">會員價兩人兩晚 · ${fmtHK(117040)}</div></div><div class="card"><div class="k">升級差價</div><div class="v">${fmtHK(12540)}</div><div class="d">¥12,540／兩人兩晚 · 兼有套餐差異</div></div></div></section>`}
function budgetScreen(){const sum=DATA.budget.reduce((a,x)=>a+(x[1]||0),0);return `<section class="screen" id="budget"><div class="section-head"><div><h2>兩人預算明細</h2><p>所有金額以兩人為單位；空白項目未計入已知小計。</p></div><div class="editable"><label for="fx">每 ¥1 = HK$</label><input id="fx" inputmode="decimal" type="number" min="0.0001" max="0.99" step="0.00001" value="${getRate()}"/><button class="btn" id="resetFx">重設</button></div></div><div class="cards"><div class="card"><div class="k">已知項目小計 (JPY)</div><div class="v">${fmtJPY(sum)}</div><div class="d">非全旅程成本</div></div><div class="card"><div class="k">已知項目小計 (HKD)</div><div class="v" id="sumHK">${fmtHK(sum)}</div><div class="d">跟上方匯率重新計算</div></div><div class="card"><div class="k">機票</div><div class="v">已購</div><div class="d">實付總額未填入，暫不計在小計</div></div></div><div class="section-head"><h2>逐項費用</h2></div><div class="table-scroll"><table><thead><tr><th>項目</th><th>分類</th><th class="money">兩人 JPY</th><th class="money">兩人 HKD</th><th>備註</th></tr></thead><tbody>${DATA.budget.map((b,i)=>`<tr><td>${esc(b[0])}</td><td>${esc(b[2])}</td><td class="money">${fmtJPY(b[1])}</td><td class="money" data-hk="${i}">${fmtHK(b[1])}</td><td class="muted">${esc(b[3])}</td></tr>`).join('')}<tr><td colspan="2"><strong>已知小計</strong></td><td class="money"><strong>${fmtJPY(sum)}</strong></td><td class="money" id="endHK"><strong>${fmtHK(sum)}</strong></td><td>未包括機票、待報價車費及酒店、餐飲</td></tr></tbody></table></div><div class="notice topnote">匯率係估算，訂房價錢可能係未登入會員價／未計附加條款。更改匯率會保存在目前裝置嘅瀏覽器，不會自動同步 Google Sheets。</div></section>`}
function taskScreen(){return `<section class="screen" id="tasks"><div class="section-head"><div><h2>預訂清單與重要核實</h2><p>打勾狀態會儲存在你目前瀏覽器，重新開網頁仍會保留；唔會寫返 Google Sheets。</p></div><div class="toolbar"><button class="btn" id="resetTasks">重設勾選</button></div></div><div class="boxrow"><div class="panel"><h3>需要落實的項目 <span id="taskCount" class="tiny"></span></h3>${DATA.tasks.map((t,i)=>`<div class="checkrow"><input type="checkbox" id="task${i}" data-task="${i}" ${getTask(i)?'checked':''}/><div><label for="task${i}">${esc(t[0])}</label><p>${esc(t[2])}</p>${statePill(t[1])}</div></div>`).join('')}</div><div class="aside-stack"><div class="panel"><h3>官方網址</h3><div class="sourcebox">${DATA.sources.map(s=>`<a target="_blank" rel="noopener" href="${esc(s[1])}">${esc(s[0])} ↗</a>`).join('')}</div></div><div class="notice">特别提醒：溪流莊 12/24–26 官網顯示可連住兩晚，但並不等於已完成付款；Little Peaks 12/25 有團也不等於已鎖定你哋兩個名額。</div></div></div></section>`}
function getTask(i){return localStorage.getItem('jptrip_task_'+i)==='1'}
function bind(){document.querySelectorAll('input[data-task]').forEach(i=>i.onchange=()=>{localStorage.setItem('jptrip_task_'+i,i.checked?'1':'0');updateCount()});$('#resetTasks').onclick=()=>{DATA.tasks.forEach((_,i)=>localStorage.removeItem('jptrip_task_'+i));document.querySelectorAll('input[data-task]').forEach(x=>x.checked=false);updateCount()};$('#fx').oninput=(ev)=>{let n=Number(ev.target.value);if(n<=0||n>=1)return;localStorage.setItem('tripFX2026',String(n));refreshPrices()};$('#resetFx').onclick=()=>{localStorage.removeItem('tripFX2026');$('#fx').value=DATA.rate;refreshPrices()};updateCount()}
function updateCount(){let n=DATA.tasks.filter((_,i)=>getTask(i)).length;$('#taskCount').textContent=`· ${n}/${DATA.tasks.length} 完成`}
function refreshPrices(){document.querySelectorAll('[data-hk]').forEach(el=>el.textContent=fmtHK(DATA.budget[Number(el.dataset.hk)][1]));let sum=DATA.budget.reduce((a,b)=>a+(b[1]||0),0);$('#sumHK').textContent=fmtHK(sum);$('#endHK').textContent=fmtHK(sum)}
function init(){navRender();$('#content').innerHTML=overview()+DATA.days.map(dayScreen).join('')+hotelScreen()+budgetScreen()+taskScreen();bind();const hash=location.hash.slice(1);if(nav.some(n=>n[0]===hash))show(hash)}init();
</script>
</body></html>
